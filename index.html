<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Hub - Britannica Style & Custom Quizzes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 selection:bg-indigo-500 selection:text-white">

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-2xl mx-auto flex justify-between items-center py-3 border-b border-slate-800 mb-6">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
            <span class="text-2xl">🧠</span>
            <div>
                <h1 class="text-base font-black tracking-wider bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">TRIVIA HUB</h1>
                <p id="ui-subtitle" class="text-[10px] text-slate-400">Discover, Play & Create Quizzes</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <button id="home-btn" onclick="goHome()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition-all">
                🏠 大廳
            </button>
            <button onclick="openCreatorModal()" id="ui-create-nav-btn" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-bold shadow transition-all">
                ✨ 建立題庫
            </button>
            <select id="lang-selector" onchange="switchLanguage(this.value)" class="bg-slate-900 text-slate-200 text-xs px-2 py-1.5 rounded-lg border border-slate-800 focus:outline-none focus:border-indigo-500 font-medium cursor-pointer">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="w-full max-w-2xl mx-auto flex-1 flex flex-col">

        <!-- 大廳首頁 (Britannica 風格分類與自訂題庫列表) -->
        <div id="view-home" class="space-y-6">
            <div class="bg-gradient-to-br from-indigo-900/60 via-slate-900 to-violet-950/80 border border-indigo-500/30 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
                <span id="badge-daily" class="bg-indigo-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">Featured Daily</span>
                <h2 id="home-banner-title" class="text-lg font-bold text-white mt-2">今日精選：動物極限大排序</h2>
                <p id="home-banner-desc" class="text-xs text-slate-300 mt-1 leading-relaxed">挑戰全網同步的每日冷知識排序，登上全球排行榜！</p>
                <button onclick="startCategory('daily')" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-lg transition-all">
                    ▶ 立即挑戰今日任務
                </button>
            </div>

            <!-- 官方分類 -->
            <div>
                <h3 id="ui-categories-title" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Quiz Categories</h3>
                <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </div>

            <!-- 玩家自訂題庫專區 -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 id="ui-custom-title" class="text-xs font-bold text-emerald-400 uppercase tracking-widest">🌐 Community Custom Quizzes</h3>
                    <button onclick="loadCustomSets()" class="text-[11px] text-slate-400 hover:text-white">🔄 重新整理</button>
                </div>
                <div id="custom-sets-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="text-xs text-slate-500 text-center py-4 col-span-2">載入社群自訂題庫中...</div>
                </div>
            </div>
        </div>

        <!-- 遊戲進行中畫面 -->
        <div id="view-game" class="hidden space-y-4">
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div>
                        <span id="game-category-badge" class="bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Science</span>
                        <div id="game-info-str" class="text-xs text-slate-400 mt-1">日期 / 建立者</div>
                    </div>
                    <div id="ui-timer" class="text-sm font-mono bg-slate-950 px-3 py-1 rounded-full text-amber-400 border border-slate-800">⏱️ 0.0s</div>
                </div>

                <div class="space-y-3">
                    <p id="game-question-text" class="text-sm text-slate-200 font-medium leading-relaxed"></p>
                    <div id="options-list" class="space-y-2"></div>
                </div>

                <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all text-sm">
                    送出答案 🚀
                </button>

                <!-- 結果與解析 -->
                <div id="result-box" class="hidden space-y-3 pt-3 border-t border-slate-800">
                    <div id="result-message" class="text-center font-bold text-sm"></div>
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                        <span id="ui-exp-title" class="font-bold text-amber-400">💡 趣味冷知識解析：</span>
                        <p id="explanation-text" class="text-slate-300 leading-relaxed"></p>
                    </div>
                    <div id="score-input-section" class="space-y-2 pt-2">
                        <label id="ui-nickname-label" class="block text-xs text-slate-400">留下大名登錄排行榜：</label>
                        <div class="flex space-x-2">
                            <input type="text" id="player-nickname" maxlength="10" placeholder="請輸入暱稱" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                            <button onclick="uploadScore()" id="ui-register-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">登記成績</button>
                        </div>
                    </div>
                    <button onclick="shareResult()" id="ui-share-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 rounded-lg transition-all">
                        📋 複製戰績分享
                    </button>
                </div>
            </div>

            <!-- 排行榜區塊 -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <h3 id="ui-rank-title" class="text-xs font-bold text-indigo-400 mb-3 uppercase tracking-wider">🏆 排行榜</h3>
                <div id="leaderboard-list" class="space-y-1.5 text-xs">
                    <div class="text-slate-500 text-center py-2">載入排行榜中...</div>
                </div>
            </div>
        </div>

    </main>

    <!-- 建立題庫彈跳視窗 (Modal) -->
    <div id="creator-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="ui-modal-title" class="font-bold text-sm text-indigo-400">✨ 建立你的自訂排序題庫</h3>
                <button onclick="closeCreatorModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label id="ui-lbl-set-title" class="block text-slate-400 mb-1">題庫名稱 (Set Title)：</label>
                    <input type="text" id="new-set-title" placeholder="例如：世界名貓重量大PK" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label id="ui-lbl-creator" class="block text-slate-400 mb-1">您的名字/作者 (Creator)：</label>
                    <input type="text" id="new-set-creator" placeholder="例如：Alex" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label id="ui-lbl-q-text" class="block text-slate-400 mb-1">題目敘述 (Question)：</label>
                    <input type="text" id="new-q-text" placeholder="請將以下動物由輕到重排序" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label id="ui-lbl-options" class="block text-slate-400 mb-1">選項 (請輸入 4 個選項，順序為【正確解答順序】)：</label>
                    <div class="space-y-2">
                        <input type="text" id="opt-0" placeholder="第 1 項 (最輕/最前面)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs">
                        <input type="text" id="opt-1" placeholder="第 2 項" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs">
                        <input type="text" id="opt-2" placeholder="第 3 項" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs">
                        <input type="text" id="opt-3" placeholder="第 4 項 (最重/最後面)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs">
                    </div>
                </div>
                <div>
                    <label id="ui-lbl-exp" class="block text-slate-400 mb-1">冷知識解析 (Explanation)：</label>
                    <textarea id="new-exp" rows="2" placeholder="解釋為什麼是這個順序..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeCreatorModal()" id="ui-btn-cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold transition-all">取消</button>
                <button onclick="publishCustomSet()" id="ui-btn-publish" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-bold shadow transition-all">發布題庫 🚀</button>
            </div>
        </div>
    </div>

    <!-- 載入 JavaScript -->
    <script src="script.js"></script>
</body>
</html>
