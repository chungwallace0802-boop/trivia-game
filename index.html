<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 selection:bg-indigo-500 selection:text-white">

    <!-- 頂部導覽列 (App Header) -->

                <h1 class="text-base font-black tracking-wider bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">TRIVIA HUB</h1>
                <p class="text-[10px] text-slate-400">Discover & Sort Daily Knowledge</p>
            </div>
        </div>
        
        <!-- 頂部右側：返回首頁按鈕與語言切換 -->

            <button id="home-btn" onclick="goHome()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition-all">
                🏠 返回大廳
            </button>

                <option value="zh">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <!-- 主要內容動態切換區塊 -->

        <!-- ==========================
             頁面 A：大廳/分類與題庫清單
             ========================== -->
        <div id="view-home" class="space-y-6">
            <!-- 每日特色推薦橫幅 -->
            <div class="bg-gradient-to-br from-indigo-900/60 via-slate-900 to-violet-950/80 border border-indigo-500/30 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 text-7xl opacity-10">🌟</div>
                <span class="bg-indigo-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Featured Daily</span>
                <h2 id="home-banner-title" class="text-lg font-bold text-white mt-2">今日精選：動物極限大排序</h2>
                <p id="home-banner-desc" class="text-xs text-slate-300 mt-1 leading-relaxed">挑戰全網同步的每日冷知識，看看你能不能在最短時間內完成正確排序並登上全球排行榜！</p>
                <button onclick="startCategory('daily')" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center space-x-2">
                    <span>▶ 立即挑戰今日任務</span>

            </div>

            <!-- 分類選單區塊 (Categories) -->
            <div>
                <h3 id="ui-categories-title" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Quiz Categories & Topics</h3>
                <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- 動態載入分類卡片 -->
                </div>
            </div>
        </div>

        <!-- ==========================
             頁面 B：遊戲進行中畫面 (預設隱藏)
             ========================== -->
        <div id="view-game" class="hidden space-y-4">
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col space-y-4 backdrop-blur">
                
                <!-- 遊戲頂端資訊列 -->
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div>
                        <span id="game-category-badge" class="bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Science</span>
                        <div id="game-date-str" class="text-xs text-slate-400 mt-1">日期：2026-08-26</div>
                    </div>
                    <div id="ui-timer" class="text-sm font-mono bg-slate-950 px-3 py-1 rounded-full text-amber-400 border border-slate-800">⏱️ 0.0s</div>
                </div>

                <!-- 題目敘述 -->
                <div class="space-y-3">
                    <p id="game-question-text" class="text-sm text-slate-200 font-medium leading-relaxed"></p>
                    <div id="options-list" class="space-y-2"></div>
                </div>

                <!-- 送出按鈕 -->
                <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all text-sm">
                    送出答案 🚀
                </button>

                <!-- 結果與解析 (答對/答錯後顯示) -->
                <div id="result-box" class="hidden space-y-3 pt-3 border-t border-slate-800">
                    <div id="result-message" class="text-center font-bold text-sm"></div>
                    
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                        <span id="ui-exp-title" class="font-bold text-amber-400">💡 趣味冷知識解析：</span>
                        <p id="explanation-text" class="text-slate-300 leading-relaxed"></p>
                    </div>

                    <!-- 成績登記區 -->
                    <div id="score-input-section" class="space-y-2 pt-2">
                        <label id="ui-nickname-label" class="block text-xs text-slate-400">留下大名登錄今日排行榜：</label>
                        <div class="flex space-x-2">
                            <input type="text" id="player-nickname" maxlength="10" placeholder="請輸入暱稱" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                            <button onclick="uploadScore()" id="ui-register-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">登記成績</button>
                        </div>
                    </div>

                    <button onclick="shareResult()" id="ui-share-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 rounded-lg transition-all">
                        📋 複製戰績分享
                    </button>
                </div>
            </div>

            <!-- 排行榜區塊 -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <h3 id="ui-rank-title" class="text-xs font-bold text-indigo-400 mb-3 uppercase tracking-wider">🏆 即時排行榜</h3>
                <div id="leaderboard-list" class="space-y-1.5 text-xs">
                    <div class="text-slate-500 text-center py-2">載入排行榜中...</div>
                </div>
            </div>
        </div>

    </main>

    <!-- 底部版權 -->

        Trivia Hub &copy; 2026 &bull; Powered by Supabase & GitHub Pages
    </footer>

                rankTitle: "🏆 Live Leaderboard",

                submitBtn: "Submit Answer 🚀",
                expTitle: "💡 Fun Fact Explanation:",
                nicknameLabel: "Leave your name for today's leaderboard:",
                nicknamePlaceholder: "Enter your nickname (Max 10 chars)",
                registerBtn: "Submit Score",
                shareBtn: "📋 Copy Result",
                successMsg: "🎉 Correct! Time: ",
                failMsg: "❌ Incorrect order! Try again!",
                successToast: "Score successfully uploaded! 🎉",
                copyToast: "Result copied to clipboard!",
                noRank: "No scores yet. Be the first!",
                categories: [

                questions: {
                    daily: [

                            questionText: "Sort the following animals by their average adult body weight (Lightest to Heaviest):",
                            options: [{ text: "Domestic Cat 🐱" }, { text: "African Elephant 🐘" }, { text: "Rabbit 🐰" }, { text: "Hippo 🦛" }],
                            correctOrder: [2, 0, 3, 1],

                        }
                    ],
                    science: [
                        {
                            questionText: "Sort the following solar system planets by their distance from the Sun (Closest to Farthest):",
                            options: [{ text: "Earth 🌍" }, { text: "Mercury ☿" }, { text: "Jupiter ♃" }, { text: "Mars ♂" }],

                            explanation: "The order from closest to farthest: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune."
                        }
                    ],
                    history: [
                        {
                            questionText: "Sort the following historical events by chronological order (Earliest to Latest):",
                            options: [{ text: "Invention of Paper 📜" }, { text: "Moon Landing 🌕" }, { text: "World War I ⚔️" }, { text: "Invention of Steam Engine 🚂" }],
                            correctOrder: [0, 3, 2, 1],
                            explanation: "Paper invention was earliest, followed by the steam engine, WWI (1914), and the Moon landing in 1969."
                        }
                    ],
                    geography: [
                        {
                            questionText: "Sort the following cities by latitude from North to South (Northernmost on top):",
                            options: [{ text: "Tokyo 🗼" }, { text: "London 🇬🇧" }, { text: "Singapore 🇸🇬" }, { text: "Taipei 🇹🇼" }],
                            correctOrder: [1, 0, 3, 2],
                            explanation: "London is furthest north (~51°N), followed by Tokyo, Taipei, and Singapore near the equator."
                        }
                    ],
                    popculture: [
                        {
                            questionText: "Sort the following items by their average value or size (Smallest to Largest):",
                            options: [{ text: "Smartphone 📱" }, { text: "Ballpoint Pen 🖊️" }, { text: "Laptop 💻" }, { text: "Family Car 🚗" }],
                            correctOrder: [1, 0, 2, 3],
                            explanation: "A pen is smallest/cheapest, followed by a phone, laptop, and family car."
                        }
                    ]
                }
            }
        };

        let currentLang = 'zh';
        let currentCategory = 'daily';

        // ==========================================
        // 🛠️ SUPABASE 設定
        // ==========================================
        const SUPABASE_URL = 'https://xqzxtexxjuedzejgsudk.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_F5FKV-tD7SNjLziE0GXD5Q_R5UX8dYr';
        let supabaseClient = null;
        try {
            if (SUPABASE_URL.includes('supabase.co')) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) { console.error(e); }

        // 遊戲狀態變數
        let currentOptions = [];
        let startTime = null;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let isGameFinished = false;
        let activeQuestion = null;
        let todayStr = "";

        window.addEventListener('DOMContentLoaded', () => {
            renderHome();
        });

        // 切換語言
        function switchLanguage(lang) {
            currentLang = lang;
            renderHome();
            if (!document.getElementById('view-game').classList.contains('hidden')) {
                startCategory(currentCategory);
            }
        }

        // 渲染首頁大廳
        function renderHome() {
            const data = appData[currentLang];
            document.getElementById('home-banner-title').innerText = data.bannerTitle;
            document.getElementById('home-banner-desc').innerText = data.bannerDesc;
            document.getElementById('ui-categories-title').innerText = data.categoriesTitle;
            document.getElementById('home-btn').classList.add('hidden');
            
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('view-game').classList.add('hidden');

            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';
            data.categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 hover:bg-slate-800/90 border border-slate-800 hover:border-indigo-500/50 rounded-xl p-4 cursor-pointer transition-all flex flex-col justify-between shadow-md group";
                card.onclick = () => startCategory(cat.id);
                card.innerHTML = `
                    <div>
                        <div class="text-2xl mb-2">${cat.icon}</div>
                        <h4 class="font-bold text-sm text-slate-200 group-hover:text-indigo-400 transition-colors">${cat.name}</h4>
                        <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">${cat.desc}</p>
                    </div>
                    <div class="mt-4 flex items-center text-[11px] font-semibold text-indigo-400">
                        <span>Play Quiz →</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 返回首頁
        function goHome() {
            clearInterval(timerInterval);
            renderHome();
        }

        // 開始指定分類的遊戲
        function startCategory(catId) {
            currentCategory = catId;
            isGameFinished = false;
            elapsedSeconds = 0;

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');
            document.getElementById('home-btn').classList.remove('hidden');
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('submit-btn').classList.remove('hidden');
            document.getElementById('score-input-section').classList.remove('hidden');
            document.getElementById('player-nickname').value = '';

            const now = new Date();
            todayStr = now.toISOString().split('T')[0];
            const data = appData[currentLang];
            document.getElementById('game-date-str').innerText = `${data.datePrefix}${todayStr}`;
            document.getElementById('game-category-badge').innerText = catId.toUpperCase();
            document.getElementById('ui-rank-title').innerText = data.rankTitle;

            // 取得對應分類的題目
            const qList = data.questions[catId] || data.questions.daily;
            activeQuestion = qList[0]; // 可擴充隨機抽取

            document.getElementById('game-question-text').innerText = activeQuestion.questionText;

            currentOptions = activeQuestion.options.map((opt, idx) => ({
                text: opt.text,
                originalIndex: idx
            }));

            shuffleArray(currentOptions);
            renderOptions();
            startTimer();
            fetchRankings();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            const correctIds = activeQuestion.correctOrder;
            const currentIds = array.map(item => item.originalIndex);
            if (JSON.stringify(currentIds) === JSON.stringify(correctIds)) {
                [array[0], array[1]] = [array[1], array[0]];
            }
        }

        function renderOptions() {
            const listContainer = document.getElementById('options-list');
            listContainer.innerHTML = '';

            currentOptions.forEach((option, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl p-3 transition-all";
                
                const textSpan = document.createElement('span');
                textSpan.className = "text-xs font-medium text-slate-200";
                textSpan.innerText = `${index + 1}. ${option.text}`;
                itemDiv.appendChild(textSpan);

                if (!isGameFinished) {
                    const btnGroup = document.createElement('div');
                    btnGroup.className = "flex space-x-1";

                    const upBtn = document.createElement('button');
                    upBtn.innerHTML = "▲";
                    upBtn.className = `w-7 h-7 flex items-center justify-center rounded-lg text-xs font-bold ${index === 0 ? 'bg-slate-900 text-slate-700 cursor-not-allowed' : 'bg-slate-900 hover:bg-indigo-600 text-slate-300'}`;
                    upBtn.disabled = (index === 0);
                    upBtn.onclick = () => moveOption(index, index - 1);
                    btnGroup.appendChild(upBtn);

                    const downBtn = document.createElement('button');
                    downBtn.innerHTML = "▼";
                    downBtn.className = `w-7 h-7 flex items-center justify-center rounded-lg text-xs font-bold ${index === currentOptions.length - 1 ? 'bg-slate-900 text-slate-700 cursor-not-allowed' : 'bg-slate-900 hover:bg-indigo-600 text-slate-300'}`;
                    downBtn.disabled = (index === currentOptions.length - 1);
                    downBtn.onclick = () => moveOption(index, index + 1);
                    btnGroup.appendChild(downBtn);

                    itemDiv.appendChild(btnGroup);
                }
                listContainer.appendChild(itemDiv);
            });
        }

        function moveOption(fromIdx, toIdx) {
            const movedItem = currentOptions.splice(fromIdx, 1)[0];
            currentOptions.splice(toIdx, 0, movedItem);
            renderOptions();
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                if (!isGameFinished) {
                    const delta = (Date.now() - startTime) / 1000;
                    elapsedSeconds = parseFloat(delta.toFixed(1));
                    document.getElementById('ui-timer').innerText = `⏱️ ${elapsedSeconds.toFixed(1)}s`;
                }
            }, 100);
        }

        function checkAnswer() {
            if (isGameFinished) return;

            const userOrder = currentOptions.map(item => item.originalIndex);
            const correctOrder = activeQuestion.correctOrder;
            const isCorrect = JSON.stringify(userOrder) === JSON.stringify(correctOrder);

            clearInterval(timerInterval);
            isGameFinished = true;

            const data = appData[currentLang];
            const resultBox = document.getElementById('result-box');
            const resultMsg = document.getElementById('result-message');
            
            resultBox.classList.remove('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('ui-exp-title').innerText = data.expTitle;
            document.getElementById('ui-nickname-label').innerText = data.nicknameLabel;
            document.getElementById('player-nickname').placeholder = data.nicknamePlaceholder;
            document.getElementById('ui-register-btn').innerText = data.registerBtn;
            document.getElementById('ui-share-btn').innerText = data.shareBtn;

            if (isCorrect) {
                resultMsg.className = "text-center font-bold text-sm text-emerald-400";
                resultMsg.innerText = `${data.successMsg}${elapsedSeconds}s`;
                document.getElementById('explanation-text').innerText = activeQuestion.explanation;
                renderOptions();
            } else {
                resultMsg.className = "text-center font-bold text-sm text-rose-400";
                resultMsg.innerText = `${data.failMsg} (${elapsedSeconds}s)`;
                document.getElementById('score-input-section').classList.add('hidden');
                document.getElementById('explanation-text').innerText = activeQuestion.explanation;
                renderOptions();
            }
        }

        async function uploadScore() {
            const nickname = document.getElementById('player-nickname').value.trim();
            if (!nickname) {
                alert(currentLang === 'en' ? "Please enter your nickname!" : "請輸入您的暱稱！");
                return;
            }
            if (!supabaseClient) {
                alert("Database not connected.");
                return;
            }

            const { error } = await supabaseClient
                .from('rankings')
                .insert([{ date_str: todayStr, nickname: nickname, is_correct: true, elapsed_seconds: elapsedSeconds }]);

            if (error) {
                alert("上傳失敗，請稍後再試！");
            } else {
                alert(appData[currentLang].successToast);
                document.getElementById('score-input-section').classList.add('hidden');
                fetchRankings();
            }
        }

        async function fetchRankings() {
            const rankListContainer = document.getElementById('leaderboard-list');
            if (!supabaseClient) {
                rankListContainer.innerHTML = `<div class="text-slate-500 text-center py-2">Database offline.</div>`;
                return;
            }

            const { data, error } = await supabaseClient
                .from('rankings')
                .select('*')
                .eq('date_str', todayStr)
                .order('elapsed_seconds', { ascending: true })
                .limit(10);

            if (error || !data || data.length === 0) {
                rankListContainer.innerHTML = `<div class="text-slate-500 text-center py-2">${appData[currentLang].noRank}</div>`;
                return;
            }

            rankListContainer.innerHTML = '';
            data.forEach((row, idx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = "flex justify-between items-center bg-slate-950 px-3 py-2 rounded-lg border border-slate-800/80";
                let medal = `#${idx + 1}`;
                if (idx === 0) medal = "🥇"; else if (idx === 1) medal = "🥈"; else if (idx === 2) medal = "🥉";

                rowDiv.innerHTML = `
                    <span class="font-medium text-slate-300">${medal} ${escapeHtml(row.nickname)}</span>
                    <span class="font-mono text-indigo-400 font-bold">${row.elapsed_seconds}s</span>
                `;
                rankListContainer.appendChild(rowDiv);
            });
        }

        function shareResult() {
            const data = appData[currentLang];
            const text = `Trivia Hub - ${currentCategory.toUpperCase()}\n⏱️ ${elapsedSeconds}s\n🔗 ${window.location.href}`;
            navigator.clipboard.writeText(text).then(() => alert(data.copyToast));
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
