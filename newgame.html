<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Trivia Sorting Challenge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-indigo-500 selection:text-white">

    <!-- 頂部標題與語言切換 -->
    <header class="w-full max-w-md flex justify-between items-center mb-4 relative">
        <div>
            <div id="ui-date" class="text-xs text-slate-400 font-medium">日期：載入中...</div>
            <div id="ui-day-badge" class="inline-block bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold mt-1">Day --</div>
        </div>
        <!-- 語言切換選單 -->
        <div class="flex items-center space-x-2">
            <span class="text-xs text-slate-400">🌐</span>
            <select id="lang-selector" onchange="switchLanguage(this.value)" class="bg-slate-800 text-slate-200 text-xs px-2 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 font-medium cursor-pointer">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <!-- 主要遊戲區塊 -->
    <main class="w-full max-w-md bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-5 shadow-xl flex flex-col space-y-4">
        
        <!-- 標題與計時器 -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
            <h1 id="ui-app-title" class="text-base font-bold text-indigo-400">🧠 每日冷知識排序</h1>
            <div id="ui-timer" class="text-sm font-mono bg-slate-900/60 px-3 py-1 rounded-full text-amber-400 border border-slate-700">⏱️ 0.0s</div>
        </div>

        <!-- 題目說明 -->
        <div id="question-container" class="space-y-3">
            <p id="ui-instruction" class="text-sm text-slate-300 font-medium leading-relaxed"></p>
            
            <!-- 選項列表 (動態生成) -->
            <div id="options-list" class="space-y-2"></div>
        </div>

        <!-- 送出按鈕 -->
        <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 text-sm">
            送出答案 🚀
        </button>

        <!-- 結果與解析區 (預設隱藏) -->
        <div id="result-box" class="hidden space-y-3 pt-3 border-t border-slate-700">
            <div id="result-message" class="text-center font-bold text-sm"></div>
            
            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-xs space-y-1">
                <span id="ui-exp-title" class="font-bold text-amber-400">💡 趣味冷知識解析：</span>
                <p id="explanation-text" class="text-slate-300 leading-relaxed"></p>
            </div>

            <!-- 成績登記區 -->
            <div id="score-input-section" class="space-y-2 pt-2">
                <label id="ui-nickname-label" class="block text-xs text-slate-400">留下大名登錄今日排行榜：</label>
                <div class="flex space-x-2">
                    <input type="text" id="player-nickname" maxlength="10" placeholder="請輸入暱稱" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="uploadScore()" id="ui-register-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">登記成績</button>
                </div>
            </div>

            <!-- 分享戰績按鈕 -->
            <button onclick="shareResult()" id="ui-share-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold py-2 rounded-lg transition-all">
                📋 複製今日戰績
            </button>
        </div>
    </main>

    <!-- 排行榜區塊 -->
    <section class="w-full max-w-md bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-4 shadow-xl mt-4">
        <h2 id="ui-rank-title" class="text-xs font-bold text-indigo-400 mb-3 uppercase tracking-wider">🏆 今日排行榜 (速報)</h2>
        <div id="leaderboard-list" class="space-y-1.5 text-xs">
            <div id="ui-loading-rank" class="text-slate-500 text-center py-2">正在載入排行榜資料...</div>
        </div>
    </section>

    <!-- 底部版權 -->
    <footer class="mt-6 text-center text-[10px] text-slate-500">
        Daily Trivia Sorting Challenge &copy; 2026
    </footer>

    <!-- JavaScript 遊戲核心與多語言邏輯 -->
    <script>
        // ==========================================
        // 🌐 多語言字典與題庫設定
        // ==========================================
        const langData = {
            zh: {
                appTitle: "🧠 每日冷知識排序",
                instruction: "請點擊「▲」與「▼」將下方選項排至正確順序（由上至下）：",
                submitBtn: "送出答案 🚀",
                expTitle: "💡 趣味冷知識解析：",
                nicknameLabel: "留下大名登錄今日排行榜：",
                nicknamePlaceholder: "請輸入您的暱稱 (最多10字)",
                registerBtn: "登記成績",
                shareBtn: "📋 複製今日戰績",
                rankTitle: "🏆 今日排行榜 (速報)",
                loadingRank: "正在載入排行榜資料...",
                noRank: "今日尚無通關記錄，快來搶頭香！",
                datePrefix: "日期：",
                dayPrefix: "Day ",
                successMsg: "🎉 恭喜通關！耗時 ",
                failMsg: "❌ 順序不正確！再試一次！",
                successToast: "成績成功登錄排行榜！🎉",
                copyToast: "已複製戰績到剪貼簿！",
                questions: [
                    {
                        questionText: "請將以下動物依照「成年體型平均體重」由輕到重排序：",
                        options: [{ text: "家貓 🐱" }, { text: "非洲象 🐘" }, { text: "兔子 🐰" }, { text: "河馬 🦛" }],
                        correctOrder: [2, 0, 3, 1],
                        explanation: "一般成年兔約 2 公斤，家貓約 4 公斤，河馬可達 1.5 噸，而成年非洲象則重達 5 噸左右！"
                    },
                    {
                        questionText: "請將以下太陽系行星依照「距離太陽由近到遠」排序：",
                        options: [{ text: "地球 🌍" }, { text: "水星 ☿" }, { text: "木星 ♃" }, { text: "火星 ♂" }],
                        correctOrder: [1, 0, 3, 2],
                        explanation: "距離太陽由近至遠依序為：水星、金星、地球、火星、木星、土星、天王星、海王星。"
                    }
                ]
            },
            en: {
                appTitle: "🧠 Daily Trivia Sorting",
                instruction: "Tap '▲' and '▼' to sort the items in correct order (Top to Bottom):",
                submitBtn: "Submit Answer 🚀",
                expTitle: "💡 Fun Fact Explanation:",
                nicknameLabel: "Leave your name for today's leaderboard:",
                nicknamePlaceholder: "Enter your nickname (Max 10 chars)",
                registerBtn: "Submit Score",
                shareBtn: "📋 Copy Today's Result",
                rankTitle: "🏆 Today's Leaderboard (Live)",
                loadingRank: "Loading leaderboard...",
                noRank: "No scores yet today. Be the first!",
                datePrefix: "Date: ",
                dayPrefix: "Day ",
                successMsg: "🎉 Correct! Time: ",
                failMsg: "❌ Incorrect order! Try again!",
                successToast: "Score successfully uploaded! 🎉",
                copyToast: "Result copied to clipboard!",
                questions: [
                    {
                        questionText: "Sort the following animals by their average adult body weight (Lightest to Heaviest):",
                        options: [{ text: "Domestic Cat 🐱" }, { text: "African Elephant 🐘" }, { text: "Rabbit 🐰" }, { text: "Hippo 🦛" }],
                        correctOrder: [2, 0, 3, 1],
                        explanation: "An adult rabbit is about 2kg, a cat is about 4kg, a hippo can reach 1.5 tons, and an African elephant weighs around 5 tons!"
                    },
                    {
                        questionText: "Sort the following solar system planets by their distance from the Sun (Closest to Farthest):",
                        options: [{ text: "Earth 🌍" }, { text: "Mercury ☿" }, { text: "Jupiter ♃" }, { text: "Mars ♂" }],
                        correctOrder: [1, 0, 3, 2],
                        explanation: "The order from closest to farthest is: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune."
                    }
                ]
            }
        };

        let currentLang = 'zh'; // 預設語言

        // ==========================================
        // 🛠️ SUPABASE 設定區 (已自動填入您的專案資訊)
        // ==========================================
        const SUPABASE_URL = 'https://xqzxtexxjuedzejgsudk.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_F5FKV-tD7SNjLziE0GXD5Q_R5UX8dYr';
        
        let supabaseClient = null;
        try {
            if (SUPABASE_URL.includes('supabase.co')) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error("Supabase 初始化失敗", e);
        }

        // 遊戲狀態變數
        let currentOptions = [];
        let startTime = null;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let isGameFinished = false;
        let activeQuestion = null;
        let todayStr = "";
        let dayIndex = 1;

        // 初始化載入
        window.addEventListener('DOMContentLoaded', () => {
            initGame();
            fetchRankings();
        });

        // 切換語言函式
        function switchLanguage(lang) {
            currentLang = lang;
            updateUIStrings();
            loadDailyQuestion();
        }

        // 更新介面文字
        function updateUIStrings() {
            const t = langData[currentLang];
            document.getElementById('ui-app-title').innerText = t.appTitle;
            document.getElementById('ui-instruction').innerText = t.instruction;
            document.getElementById('submit-btn').innerText = t.submitBtn;
            document.getElementById('ui-exp-title').innerText = t.expTitle;
            document.getElementById('ui-nickname-label').innerText = t.nicknameLabel;
            document.getElementById('player-nickname').placeholder = t.nicknamePlaceholder;
            document.getElementById('ui-register-btn').innerText = t.registerBtn;
            document.getElementById('ui-share-btn').innerText = t.shareBtn;
            document.getElementById('ui-rank-title').innerText = t.rankTitle;
        }

        // 初始化今日題目與日期
        function initGame() {
            const now = new Date();
            todayStr = now.toISOString().split('T')[0];
            
            // 計算 Day 數字 (以 2026-08-26 作為基底)
            const baselineDate = new Date('2026-08-26');
            const diffTime = now - baselineDate;
            dayIndex = Math.max(1, Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1);

            updateUIStrings();

            const t = langData[currentLang];
            document.getElementById('ui-date').innerText = `${t.datePrefix}${todayStr}`;
            document.getElementById('ui-day-badge').innerText = `${t.dayPrefix}${dayIndex}`;

            loadDailyQuestion();
            startTimer();
        }

        // 載入當日題目
        function loadDailyQuestion() {
            const questions = langData[currentLang].questions;
            const qIndex = (dayIndex - 1) % questions.length;
            activeQuestion = questions[qIndex];

            document.getElementById('ui-instruction').innerText = activeQuestion.questionText;
            
            // 複製選項並加上原始索引追蹤
            currentOptions = activeQuestion.options.map((opt, idx) => ({
                text: opt.text,
                originalIndex: idx
            }));

            // 如果遊戲尚未結束，隨機打亂初始順序
            if (!isGameFinished) {
                shuffleArray(currentOptions);
            }

            renderOptions();
        }

        // 陣列洗牌函式
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            // 確保打亂後不是完美正確答案（增加趣味）
            const correctIds = activeQuestion.correctOrder;
            const currentIds = array.map(item => item.originalIndex);
            if (JSON.stringify(currentIds) === JSON.stringify(correctIds)) {
                [array[0], array[1]] = [array[1], array[0]];
            }
        }

        // 渲染選項清單與上下調整按鈕
        function renderOptions() {
            const listContainer = document.getElementById('options-list');
            listContainer.innerHTML = '';

            currentOptions.forEach((option, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center justify-between bg-slate-900/80 border border-slate-700/80 rounded-xl p-3 transition-all";
                
                const textSpan = document.createElement('span');
                textSpan.className = "text-xs font-medium text-slate-200";
                textSpan.innerText = `${index + 1}. ${option.text}`;
                itemDiv.appendChild(textSpan);

                if (!isGameFinished) {
                    const btnGroup = document.createElement('div');
                    btnGroup.className = "flex space-x-1";

                    // 往上按鈕
                    const upBtn = document.createElement('button');
                    upBtn.innerHTML = "▲";
                    upBtn.className = `w-7 h-7 flex items-center justify-center rounded-lg text-xs font-bold ${index === 0 ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-800 hover:bg-indigo-600 text-slate-300'}`;
                    upBtn.disabled = (index === 0);
                    upBtn.onclick = () => moveOption(index, index - 1);
                    btnGroup.appendChild(upBtn);

                    // 往下按鈕
                    const downBtn = document.createElement('button');
                    downBtn.innerHTML = "▼";
                    downBtn.className = `w-7 h-7 flex items-center justify-center rounded-lg text-xs font-bold ${index === currentOptions.length - 1 ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-800 hover:bg-indigo-600 text-slate-300'}`;
                    downBtn.disabled = (index === currentOptions.length - 1);
                    downBtn.onclick = () => moveOption(index, index + 1);
                    btnGroup.appendChild(downBtn);

                    itemDiv.appendChild(btnGroup);
                }

                listContainer.appendChild(itemDiv);
            });
        }

        // 移動選項順序
        function moveOption(fromIdx, toIdx) {
            const movedItem = currentOptions.splice(fromIdx, 1)[0];
            currentOptions.splice(toIdx, 0, movedItem);
            renderOptions();
        }

        // 計時器開始
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                if (!isGameFinished) {
                    const delta = (Date.now() - startTime) / 1000;
                    elapsedSeconds = parseFloat(delta.toFixed(1));
                    document.getElementById('ui-timer').innerText = `⏱️ ${elapsedSeconds.toFixed(1)}s`;
                }
            }, 100);
        }

        // 檢查答案
        function checkAnswer() {
            if (isGameFinished) return;

            const userOrder = currentOptions.map(item => item.originalIndex);
            const correctOrder = activeQuestion.correctOrder;
            const isCorrect = JSON.stringify(userOrder) === JSON.stringify(correctOrder);

            clearInterval(timerInterval);
            isGameFinished = true;

            const t = langData[currentLang];
            const resultBox = document.getElementById('result-box');
            const resultMsg = document.getElementById('result-message');
            const submitBtn = document.getElementById('submit-btn');

            resultBox.classList.remove('hidden');
            submitBtn.classList.add('hidden');

            if (isCorrect) {
                resultMsg.className = "text-center font-bold text-sm text-emerald-400";
                resultMsg.innerText = `${t.successMsg}${elapsedSeconds}s`;
                document.getElementById('explanation-text').innerText = activeQuestion.explanation;
                renderOptions(); // 重新渲染（隱藏上下按鈕）
            } else {
                resultMsg.className = "text-center font-bold text-sm text-rose-400";
                resultMsg.innerText = `${t.failMsg} (${elapsedSeconds}s)`;
                document.getElementById('score-input-section').classList.add('hidden'); // 答錯不給登錄排行榜
                document.getElementById('explanation-text').innerText = activeQuestion.explanation;
                renderOptions();
            }
        }

        // 上傳成績至 Supabase
        async function uploadScore() {
            const nickname = document.getElementById('player-nickname').value.trim();
            if (!nickname) {
                alert(currentLang === 'en' ? "Please enter your nickname!" : "請輸入您的暱稱！");
                return;
            }

            if (!supabaseClient) {
                alert("Supabase client not initialized.");
                return;
            }

            const { data, error } = await supabaseClient
                .from('rankings')
                .insert([
                    { date_str: todayStr, nickname: nickname, is_correct: true, elapsed_seconds: elapsedSeconds }
                ]);

            if (error) {
                console.error("上傳失敗", error);
                alert("上傳失敗，請稍後再試！");
            } else {
                alert(langData[currentLang].successToast);
                document.getElementById('score-input-section').classList.add('hidden');
                fetchRankings();
            }
        }

        // 抓取排行榜資料
        async function fetchRankings() {
            const rankListContainer = document.getElementById('leaderboard-list');
            
            if (!supabaseClient) {
                rankListContainer.innerHTML = `<div class="text-slate-500 text-center py-2">Database not connected.</div>`;
                return;
            }

            const { data, error } = await supabaseClient
                .from('rankings')
                .select('*')
                .eq('date_str', todayStr)
                .order('elapsed_seconds', { ascending: true })
                .limit(10);

            if (error) {
                console.error("載入排行榜失敗", error);
                rankListContainer.innerHTML = `<div class="text-rose-400 text-center py-2">Failed to load rankings.</div>`;
                return;
            }

            if (!data || data.length === 0) {
                rankListContainer.innerHTML = `<div class="text-slate-500 text-center py-2">${langData[currentLang].noRank}</div>`;
                return;
            }

            rankListContainer.innerHTML = '';
            data.forEach((row, idx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = "flex justify-between items-center bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-800";
                
                let medal = `#${idx + 1}`;
                if (idx === 0) medal = "🥇";
                else if (idx === 1) medal = "🥈";
                else if (idx === 2) medal = "🥉";

                rowDiv.innerHTML = `
                    <span class="font-medium text-slate-300">${medal} ${escapeHtml(row.nickname)}</span>
                    <span class="font-mono text-indigo-400 font-bold">${row.elapsed_seconds}s</span>
                `;
                rankListContainer.appendChild(rowDiv);
            });
        }

        // 分享戰績
        function shareResult() {
            const t = langData[currentLang];
            const text = `${t.appTitle} - ${t.dayPrefix}${dayIndex}\n⏱️ ${elapsedSeconds}s\n🔗 ${window.location.href}`;
            navigator.clipboard.writeText(text).then(() => {
                alert(t.copyToast);
            });
        }

        // 防止 XSS 攻擊的跳脫函式
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
